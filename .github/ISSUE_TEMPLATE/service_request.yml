name: Service Preset Request
description: Suggest a new live package registry, forge, or developer platform preset.
title: '[Preset]: '
labels: ['enhancement', 'service-preset']
body:
  - type: markdown
    attributes:
      value: |
        Presets cover developer registries, forges, and platforms with **documented, public, token-free `GET` JSON APIs** (`<= 2 MB`, no HTML scraping) – PRs are also welcome via the [Contributing Guide](https://github.com/xulbux/svg-api/blob/main/CONTRIBUTING.md#adding-a-service-preset)! Need a static badge instead? Any label and value already works via `/badge/:label/:value` or the [Badge Builder](https://svg.xul.is/builder/badge).

  - type: input
    id: service
    attributes:
      label: Service Name
      description: Name and homepage of the registry or platform.
      placeholder: Example Registry (https://example.org)
    validations:
      required: true

  - type: input
    id: api_url
    attributes:
      label: Public JSON Endpoint
      description: Live unauthenticated `GET` JSON URL (or API docs).
      placeholder: https://api.example.org/v1/packages/hono
    validations:
      required: true

  - type: textarea
    id: metrics
    attributes:
      label: Metrics & Route Shape
      description: Desired metrics (e.g., `v`, `dt`, `dl`, `license`, `stars`) and target format.
      placeholder: |
        Route: /badge/example/:pkg/:metric
        Metrics: v, dt, license
    validations:
      required: true
