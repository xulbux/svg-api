# This workflow validates the `svg-api` Worker on every push and PR, and deploys to Cloudflare on `main`.
# Tool versions are inherited from `package.json`; Node.js from `engines.node`, `pnpm` from `packageManager`.
# One job runs the full `pnpm run check` suite (formatting, linting, Markdown linting, type checking,
# tests, and the Worker bundle dry-run) and deploys right after it passes.

name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded validation runs of the same ref.
# Pushes to `main` are never cancelled, so a deploy is never interrupted mid-way:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format, lint, type-check, test, dry-run)
        run: pnpm run check

      - name: Deploy to Cloudflare Workers
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm run deploy
